[project]
name = "r53-sync"
version = "0.1.0"
description = "Keep a host's Route53 A/AAAA records pointed at its Tailscale addresses"
readme = "README.md"
authors = [
    { name = "Jon Mark Allen", email = "ubahmapk@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.44.0",
    "dynaconf>=3.3.5",
    "loguru>=0.8.0",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[project.urls]
Repository = "https://github.com/ubahmapk/r53-sync"
Issues = "https://github.com/ubahmapk/r53-sync/issues"

[project.scripts]
r53-sync = "r53_sync.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[route53]>=1.44.0",
    "moto>=5.2.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT", "PTH",
    "TCH", "ARG", "ERA", "PL", "T20", "DTZ",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures requested only for their side effects (a mocked zone, env vars) count as unused args.
"tests/**" = ["S101", "PLR2004", "ARG001"]

[tool.pytest.ini_options]
addopts = "--cov=r53_sync --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/r53_sync"]
branch = true

[tool.ty.environment]
python-version = "3.14"
